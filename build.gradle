buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        maven { url = 'https://repo.grails.org/grails/restricted' }
    }
    dependencies {
        classpath platform("org.apache.grails:grails-bom:$grailsVersion")
        classpath "org.apache.grails:grails-gradle-plugins"    // version from BOM
        classpath "com.gorylenko.gradle-git-properties:gradle-git-properties:4.0.1"
    }
}

apply plugin: "groovy"
apply plugin: "idea"
apply plugin: "org.apache.grails.gradle.grails-plugin"
apply plugin: "maven-publish"
apply plugin: "com.gorylenko.gradle-git-properties"

group "org.grails.plugins"

repositories {
    mavenLocal()
    mavenCentral()
    maven { url "https://repo.grails.org/grails/core" }
    maven { url "https://repo.grails.org/grails/restricted" }
}

configurations {
    all {
        resolutionStrategy.eachDependency { DependencyResolveDetails details ->
            if (details.requested.group == 'org.seleniumhq.selenium') {
                details.useVersion('4.19.1')
            }
        }
        exclude group: 'org.glassfish', module: 'javax.el' //vulnerable dependencies
        exclude group: 'commons-collections', module: 'commons-collections'
        exclude group: 'org.apache.commons', module: 'commons-compress'
        exclude group: 'commons-fileupload', module: 'commons-fileupload'
    }
}

dependencies {
    console "org.apache.grails:grails-console"
    developmentOnly "org.springframework.boot:spring-boot-devtools"
    implementation platform("org.apache.grails:grails-bom:$grailsVersion")
    implementation "org.springframework.boot:spring-boot-starter-logging"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation "org.springframework.boot:spring-boot-autoconfigure"
    implementation "org.springframework.boot:spring-boot-starter"
    implementation "org.apache.grails:grails-core"
    implementation "org.apache.grails:grails-controllers"
    implementation "org.apache.grails:grails-rest-transforms"
    implementation "org.apache.grails.web:grails-web-mvc"
    implementation "org.apache.grails:grails-gsp"
    implementation "org.apache.grails.views:grails-web-gsp"
    implementation "org.apache.grails.views:grails-web-gsp-taglib"
    profile "org.apache.grails.profiles:plugin"
    testImplementation "org.apache.grails.testing:grails-testing-support-core"
    testImplementation "org.apache.grails:grails-testing-support-web"
    testImplementation "org.spockframework:spock-core"

    // Spock requires Byte Buddy to mock non-interface classes.
    // Added explicitly because it is no longer available transitively after the Grails 7 upgrade.
    testImplementation "net.bytebuddy:byte-buddy"
    testRuntimeOnly "net.bytebuddy:byte-buddy-agent"
}

compileJava.options.release = 17

// https://github.com/apache/grails-core/issues/15321
tasks.withType(GroovyCompile).configureEach {
    groovyOptions.optimizationOptions.indy = false
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

task sourceJar(type: Jar) {
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
}

task packageJavadoc(type: Jar) {
    from javadoc
    archiveClassifier = 'javadoc'
}

task packageGroovydoc(type: Jar) {
    from groovydoc
    archiveClassifier = 'groovydoc'
}

gitProperties {
    keys = ['git.branch', 'git.commit.id', 'git.commit.time', 'git.commit.id.abbrev']
    failOnNoGitDirectory = true
    extProperty = 'gitProps' // git properties will be put in a map at project.ext.gitProps
}

generateGitProperties.outputs.upToDateWhen { false } // make sure the generateGitProperties task always executes (even when git.properties is not changed)

jar {
    dependsOn generateGitProperties
    manifest {
        attributes("Built-By": System.getProperty("user.name"))
        attributes(["Plugin-Version"        : version,
                    "Plugin-Title"          : project.name,
                    "Plugin-Build-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                    "Git-Commit"            : "${-> project.ext.gitProps['git.commit.id.abbrev']}",
                    "Git-Branch"            : "${-> project.ext.gitProps['git.branch']}",
                    "Published-By"          : project.findProperty("nexusUsername") ?: System.getenv("NEXUS_USERNAME")])
    }
    from sourceSets.main.output
    exclude 'git.properties'
}

publishing {

    publications {
        mavenJar(MavenPublication) {
            from components.java
            artifact sourceJar
            artifact packageJavadoc
            artifact packageGroovydoc
        }
    }

    repositories {
        maven {
            name = "NexusRepo"
            credentials {
                username project.findProperty("nexusUsername") ?: System.getenv("NEXUS_USERNAME")
                password project.findProperty("nexusPassword") ?: System.getenv("NEXUS_PASSWORD")
            }
            url project.findProperty("nexusUrl") ?: System.getenv("NEXUS_URL")
            allowInsecureProtocol = project.findProperty("isNexusUrlInsecure") ? true : false
        }
    }
}

// enable if you wish to package this plugin as a standalone application
bootJar.enabled = false

bootRun.onlyIf { false }